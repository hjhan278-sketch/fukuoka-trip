<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="후쿠오카 여행">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)">
<title>후쿠오카 여행 10.28–10.31</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  color-scheme: light;
  --bg:#F2F4F6; --surface:#FFFFFF; --text:#191F28; --sub:#4E5968; --muted:#8B95A1; --faint:#B0B8C1;
  --line:#F2F4F6; --grey-btn:#F2F4F6; --blue:#3182F6; --blue-strong:#1B64DA; --blue-soft:#E8F3FF;
  --red:#F04452; --red-soft:#FFEEEE; --header:#FFFFFF; --dim:rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101013; --surface:#1E1E24; --text:#F2F2F5; --sub:#C3C3C6; --muted:#8E8E93; --faint:#5E5E66;
    --line:#2A2A31; --grey-btn:#2C2C35; --blue:#4D94FF; --blue-strong:#6AA6FF; --blue-soft:#1B2A45;
    --red:#FF5F6B; --red-soft:#3A1E22; --header:#17171C; --dim:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{background:var(--bg);color:var(--text);
  font-family:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;line-height:1.5;letter-spacing:-0.01em;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--header);z-index:11}

/* 헤더 */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--header);padding:14px 20px 12px}
header h1{font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.3}
header p{font-size:14px;color:var(--muted);font-weight:500;margin-top:2px}

main{max-width:600px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none}

/* 일차 선택 칩 */
.pills{display:flex;gap:8px;padding:4px 20px 14px;background:var(--header);overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:999px;background:var(--grey-btn);color:var(--sub);font-size:14.5px;font-weight:600}
.pill[aria-selected="true"]{background:var(--text);color:var(--surface)}

/* 세그먼트 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--grey-btn);padding:4px;border-radius:12px;margin:4px 20px 14px}
.seg button{padding:8px 4px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* 카드 */
.card{background:var(--surface);border-radius:20px;margin:0 12px 12px;padding:8px 0}
.card-title{font-size:17px;font-weight:700;padding:14px 20px 6px}
.hint{font-size:14px;color:var(--muted);padding:0 24px 12px}

/* 일정 */
.item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:start;padding:14px 16px 14px 20px;position:relative}
.item + .item{border-top:1px solid var(--line)}
.item.tap{cursor:pointer}
.item .t{font-size:15px;font-weight:600;color:var(--muted);padding-top:1px}
.item .w{font-size:16px;font-weight:600;color:var(--text);line-height:1.4;word-break:keep-all}
.item .n{font-size:13.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--grey-btn);color:var(--sub)}
.tag.warn{background:var(--red-soft);color:var(--red)}
.tag.book{background:var(--blue-soft);color:var(--blue-strong)}
.rbtn{align-self:center;white-space:nowrap;padding:7px 11px;border-radius:9px;font-size:13.5px;font-weight:600;background:var(--grey-btn);color:var(--sub)}
.rbtn.more{background:var(--blue-soft);color:var(--blue-strong)}
.sbtn{padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;background:var(--grey-btn);color:var(--sub);white-space:nowrap}
.sbtn.primary{background:var(--blue-soft);color:var(--blue-strong)}
.item.now{background:var(--blue-soft)}
.item.now + .item{border-top-color:transparent}
.item.now .t,.item.now .w{color:var(--blue-strong)}
.item.now .rbtn{background:var(--surface)}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--blue);padding:1px 6px;border-radius:999px;margin-top:5px}
.item.past .t,.item.past .w{color:var(--faint)}
.item.past .n,.item.past .tags{opacity:.5}

/* 리스트 행 */
.row{display:flex;align-items:center;gap:12px;padding:14px 20px;min-height:60px}
.row + .row{border-top:1px solid var(--line)}
.row.tap{cursor:pointer}
.row .name{flex:1;min-width:0}
.row .name b{display:block;font-size:16.5px;font-weight:600}
.row .name small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--grey-btn);display:grid;place-items:center;font-size:20px}
.chev{flex:none;color:var(--faint)}
.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.chip{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:14px;background:var(--grey-btn);font-weight:600;font-size:15.5px}
.chip span{color:var(--faint);font-size:13px;font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}

/* 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--header);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11.5px;font-weight:600;color:var(--faint)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--text)}

/* 바텀시트 */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:600px;max-height:90vh;border-radius:24px 24px 0 0;background:var(--surface);color:var(--text);overflow:hidden}
dialog[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){dialog[open]{animation:none}}
dialog::backdrop{background:var(--dim)}
.sheet{display:flex;flex-direction:column;max-height:90vh}
.sheet-head{padding:10px 20px 6px;flex:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.back{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px -4px;padding:4px}
.cat{font-size:13px;font-weight:600;color:var(--blue-strong)}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.3;word-break:keep-all}
.sheet-body{overflow-y:auto;padding:4px 20px 12px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot.one{grid-template-columns:1fr}
.notice{font-size:13px;color:var(--sub);background:var(--bg);padding:10px 12px;border-radius:12px;margin-top:12px;line-height:1.45}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{background:var(--bg);border-radius:14px;padding:12px 14px}
.tile dt{font-size:12.5px;color:var(--muted);font-weight:500}
.tile dd{font-size:15px;font-weight:600;margin-top:2px;line-height:1.4;word-break:keep-all}
.tile dd.na{color:var(--faint);font-weight:500}
.sec{margin-top:18px}
.sec h4{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.sec p{font-size:15.5px;line-height:1.55;word-break:keep-all}
.plist .prow{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left}
.plist .prow + .prow{border-top:1px solid var(--line)}
.plist .prow .name{flex:1;min-width:0}
.plist .prow b{display:block;font-size:16px;font-weight:600}
.plist .prow small{display:block;font-size:13.5px;color:var(--muted);margin-top:1px;word-break:keep-all}
.bbtn{display:block;text-align:center;padding:15px;border-radius:14px;font-size:16px;font-weight:600;background:var(--grey-btn);color:var(--sub)}
.bbtn.primary{background:var(--blue);color:#fff}
</style>
</head>
<body>

<header>
  <h1 id="hTitle">일정</h1>
  <p id="hSub"></p>
</header>

<main>
  <section class="view" id="v-plan">
    <div class="pills" role="tablist" id="daySeg"></div>
    <div class="card" id="dayList"></div>
  </section>

  <section class="view" id="v-book" hidden>
    <p class="hint" style="padding-top:4px">예약 번호와 비밀번호는 각 앱에서 확인하세요.</p>
    <div class="card" id="bookList"></div>
  </section>

  <section class="view" id="v-etc" hidden>
    <div class="seg" role="tablist" id="homeSeg">
      <button role="tab" data-list="food" aria-selected="true">음식</button>
      <button role="tab" data-list="snack" aria-selected="false">간식</button>
    </div>
    <div id="homeList"></div>
  </section>
</main>

  <button role="tab" data-view="etc" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>기타</button>
</nav>

<dialog id="modal">
  <div class="sheet" id="sheet"></div>
</dialog>

  /* ---------- 숙소 ---------- */
  stay_fuk:{n:"후쿠오카 숙소 (Airbnb)",cat:"stay",q:"4-chōme-23-5 Hakata Ekimae, Fukuoka, 812-0011",info:{

  /* ---------- 1일차 ---------- */

  yatai:{n:"텐진 포장마차 거리",cat:"sight",q:"天神 屋台",info:{

/* =========================================================
   유틸
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const dirUrl = q => "https://www.google.com/maps/dir/?api=1&travelmode=transit&destination="+encodeURIComponent(q);
function nowJST(){ return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"})); }
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const CHEV = `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;

/* =========================================================
   바텀시트
   ========================================================= */
const CAT = {
  food:{label:"음식점",tiles:[["hours","영업시간"],["closed","휴무일"],["pay","결제"],["reserve","예약"]],secs:[["menu","대표 메뉴 · 가격대"],["wait","웨이팅"],["review","후기 요약"],["kr","한국어 메뉴판"],["tip","팁"]]},
  sight:{label:"관광지",tiles:[["hours","운영시간"],["closed","휴무일"],["fee","입장료"],["dur","소요 시간"]],secs:[["best","추천 시간대"],["tip","팁"]]},
  shop:{label:"쇼핑",tiles:[["hours","영업시간"],["floor","위치"]],secs:[["taxfree","면세"],["feature","특징"],["tip","팁"]]},
  svc:{label:"이동 · 서비스",tiles:[["hours","시간"],["fee","요금 · 예약"]],secs:[["tip","안내"]]},
  stay:{label:"숙소",tiles:[],secs:[["tip","안내"]]}
};
const modal = $("#modal"), sheet = $("#sheet");
let sheetStack = [];

function renderSheet(){
  const top = sheetStack[sheetStack.length-1];
  const back = sheetStack.length>1 ? `<button class="back" onclick="sheetBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>목록</button>` : "";
  if(top.type==="list"){
    sheet.innerHTML = `<div class="sheet-head"><div class="handle" aria-hidden="true"></div>${back}<div class="cat">${top.list.length}곳</div><h3>${esc(top.title)}</h3></div>
      <div class="sheet-body"><div class="plist">${top.list.map(k=>{
        const p=P[k]; const sub = p.info && (p.info.menu||p.info.feature||p.info.fee||"");
        return `<button class="prow" onclick="sheetPush('${k}')"><span class="name"><b>${esc(p.n)}</b>${sub?`<small>${esc(sub)}</small>`:""}</span>${CHEV}</button>`;
      }).join("")}</div></div>
      <div class="sheet-foot one"><button class="bbtn" onclick="modal.close()">닫기</button></div>`;
  } else {
    const p = P[top.key], info = p.info||{}, c = CAT[p.cat]||CAT.sight;
    const tiles = c.tiles.length ? `<dl class="tiles">${c.tiles.map(([k,l])=>`<div class="tile"><dt>${l}</dt><dd class="${info[k]?"":"na"}">${info[k]?esc(info[k]):"확인 필요"}</dd></div>`).join("")}</dl>` : "";
    const secs = c.secs.filter(([k])=>info[k]).map(([k,l])=>`<div class="sec"><h4>${l}</h4><p>${esc(info[k])}</p></div>`).join("");
    const note = p.chk ? `<p class="notice">일부 정보만 확인된 곳이에요. 영업시간과 위치는 방문 전에 구글맵에서 한 번 더 확인하세요.</p>` : "";
    sheet.innerHTML = `<div class="sheet-head"><div class="handle" aria-hidden="true"></div>${back}<div class="cat">${c.label}</div><h3>${esc(p.n)}</h3></div>
      <div class="sheet-body">${tiles}${secs}${note}</div>
      <div class="sheet-foot">
        <a class="bbtn" href="${dirUrl(p.q)}" target="_blank" rel="noopener">길찾기</a>
        <a class="bbtn primary" href="${mapUrl(p.q)}" target="_blank" rel="noopener">지도 열기</a>
      </div>`;
  }
  sheet.querySelector(".sheet-body").scrollTop = 0;
}
function openPlace(key){ sheetStack=[{type:"place",key}]; renderSheet(); if(!modal.open) modal.showModal(); }
function openList(title,list){ sheetStack=[{type:"list",title,list}]; renderSheet(); if(!modal.open) modal.showModal(); }
function sheetPush(key){ sheetStack.push({type:"place",key}); renderSheet(); }
function sheetBack(){ sheetStack.pop(); renderSheet(); }
modal.addEventListener("click",e=>{ if(e.target===modal) modal.close(); });

/* =========================================================
   일정
   ========================================================= */
let currentDay = 0, todayIdx = -1;
const daySeg = $("#daySeg");
DAYS.forEach((d,i)=>{
  const b = document.createElement("button");
  b.className="pill"; b.setAttribute("role","tab"); b.textContent=`${i+1}일차`;
  b.onclick=()=>{ renderDay(i); setHeader("plan"); };
  daySeg.appendChild(b);
});
function itemAction(d,i,j){
  const it = DAYS[d].items[j];
  if(it.more) openList(it.w,it.more); else if(it.p) openPlace(it.p);
}
function renderDay(i){
  currentDay=i;
  [...daySeg.children].forEach((b,j)=>b.setAttribute("aria-selected",j===i));
  const d=DAYS[i], now=nowJST(), today=ymd(now)===d.date, nm=now.getHours()*60+now.getMinutes();
  let nowIdx=-1; if(today) d.items.forEach((it,j)=>{ if(toMin(it.t)<=nm) nowIdx=j; });
  $("#dayList").innerHTML = d.items.map((it,j)=>{
    const isNow = today && j===nowIdx;
    const cls = [today?(isNow?"now":(j<nowIdx?"past":"")):"", (it.p||it.more)?"tap":""].join(" ");
    const btn = it.more ? `<span class="rbtn more">더보기</span>` : it.p ? `<span class="rbtn">정보</span>` : "";
    const act = (it.p||it.more) ? `onclick="itemAction(${i},${i},${j})" role="button" tabindex="0"` : "";
    return `<div class="item ${cls}" ${isNow?'id="nowItem"':''} ${act}>
      <div class="t">${it.t}${isNow?`<br><span class="badge">지금</span>`:""}</div>
      <div><div class="w">${esc(it.w)}</div>${it.n?`<div class="n">${esc(it.n)}</div>`:""}
      ${it.tags?`<div class="tags">${it.tags.map(([x,c])=>`<span class="tag ${c||""}">${esc(x)}</span>`).join("")}</div>`:""}</div>
      ${btn}</div>`;
  }).join("");
}
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("tap")){ e.preventDefault(); e.target.click(); } });

/* =========================================================
   기타 탭
   ========================================================= */
function renderHome(list){
  document.querySelectorAll("#homeSeg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.list===list));
  const el=$("#homeList");
  if(list==="food"){
    el.innerHTML = `<p class="hint">누르면 지금 있는 곳 주변 가게를 구글맵에서 찾아줘요.</p>
      <div class="card"><div class="chips">${FOOD.map(([n,q])=>`<a class="chip" href="${mapUrl(q)}" target="_blank" rel="noopener">${esc(n)}<span>${esc(q)}</span></a>`).join("")}</div></div>`;
  } else if(list==="snack"){
    el.innerHTML = `<div class="card">${SNACK.map(k=>{ const p=P[k], sub=p.info&&p.info.menu;
      return `<div class="row tap" onclick="openPlace('${k}')" role="button" tabindex="0"><span class="name"><b>${esc(p.n)}</b>${sub?`<small>${esc(sub)}</small>`:""}</span>${CHEV}</div>`; }).join("")}</div>`;
  }
}
document.querySelectorAll("#homeSeg button").forEach(b=>b.addEventListener("click",()=>renderHome(b.dataset.list)));

/* ===== 예약 탭 ===== */
$("#bookList").innerHTML = BOOK.map(b=>`<div class="row">
  <span class="name"><b>${esc(b.n)}</b><small>${esc(b.w)}</small>${b.d?`<small>${esc(b.d)}</small>`:""}</span>
  ${b.links?`<span class="links">${b.links.map(([l,u])=>`<a class="sbtn primary" href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}</span>`:""}
</div>`).join("");

/* ===== 헤더 / 탭 ===== */
function setHeader(v){
  const d=DAYS[currentDay];
  if(v==="plan"){
    $("#hTitle").textContent = currentDay===todayIdx ? "오늘의 일정" : `${currentDay+1}일차 일정`;
    $("#hSub").textContent = `${d.title.split(", ")[1]}, ${d.label}`;
  } else if(v==="book"){ $("#hTitle").textContent="예약"; $("#hSub").textContent="어디서 예약했는지 모아뒀어요"; }
  else { $("#hTitle").textContent="기타"; $("#hSub").textContent="일정대로 안 될 때 꺼내 보세요"; }
}
function showView(v){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  ["plan","book","etc"].forEach(x=>$("#v-"+x).hidden = x!==v);
  setHeader(v); window.scrollTo({top:0});
  if(v==="plan"){ const n=$("#nowItem"); if(n) setTimeout(()=>n.scrollIntoView({block:"center"}),30); }
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));

/* ===== 시작 ===== */
(function init(){
  todayIdx = DAYS.findIndex(d=>d.date===ymd(nowJST()));
  renderHome("food");
  renderDay(todayIdx>=0?todayIdx:0);
  showView("plan");
  setInterval(()=>{ renderDay(currentDay); },60000);
})();
</script>
